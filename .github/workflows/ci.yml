name: CI

on:
  push:
    branches: [main, dev, integracion]
  pull_request:
    branches: [main, dev, integracion]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, build y tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` compila @lynkdrive/shared (script prepare) antes de lint/typecheck.
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (shared + api + admin + export web de mobile)
        run: |
          npm run build -w @lynkdrive/shared
          npm run build -w @lynkdrive/api
          npm run build -w @lynkdrive/admin
          npm run build -w @lynkdrive/mobile

      - name: Tests unitarios (api + mobile)
        run: npm test

  e2e:
    name: Tests e2e API (Postgres + PostGIS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lynkdrive_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lynkdrive_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Tests e2e
        run: npm run test:e2e
